name: e2e

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  e2e:
    name: SAML end-to-end (docker)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker compose build
      - name: Run the end-to-end suite
        run: docker compose run --rm e2e
      - name: Run the full suite
        run: docker compose run --rm test
